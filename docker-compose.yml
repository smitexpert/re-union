services:
  # PHP Application
  reunion-app:
    image: php-8.4:latest
    container_name: reunion_app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PHP_VALUE=memory_limit=512M
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      # Compiled views must live outside the shared volume: the fpm pool runs
      # as www-data, and it cannot utime files owned by the host user.
      - VIEW_COMPILED_PATH=/tmp/framework/views
    volumes:
      - .:/var/www/html
    networks:
      - mollanet

  # Web Server
  reunion-nginx:
    image: nginx:alpine
    container_name: reunion_nginx
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - reunion-app
    networks:
      - mollanet

networks:
  mollanet:
    external: true
