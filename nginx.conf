server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    # The registration form posts a student photo as multipart/form-data.
    # nginx's implicit default is 1m, which rejects the request with a 413
    # before it ever reaches PHP -- phone photos are routinely larger than
    # that. Keep this above the 5 MB the app accepts (Laravel's
    # `student.photo` max:5120) and below PHP's post_max_size, so an
    # oversized photo surfaces as a validation error instead of a raw 413.
    client_max_body_size 8m;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # 'app' matches the service name in docker-compose
        fastcgi_pass reunion-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
